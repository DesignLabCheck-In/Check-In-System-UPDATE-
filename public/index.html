<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DesignLab Check-In</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <button id="admin-download" class="admin-btn">Download Admin Log</button>

  <div class="title">
    <img src="UT-Logo.png" alt="DesignLab Logo" class="logo" />
    <h1>CHECK-IN<br>SYSTEM</h1>
  </div>

  <form class="checkin-form" id="checkin-form">
    <select id="name-select" required>
      <option value="">Select your name</option>
    </select>

    <select id="team-select" required>
      <option value="">Select team</option>
      <option value="DT">DreamTeam (DT)</option>
      <option value="TT">TechTeam (TT)</option>
    </select>

    <button type="submit" id="checkin-btn">CHECK IN</button>
    <button type="button" id="checkout-btn" class="btn-outline-green">CHECK OUT</button>
  </form>

  <!-- Access gate -->
  <div id="access-modal" class="modal-overlay" style="display: flex;">
    <div class="modal-box">
      <p style="margin-top: 0;">Enter access password:</p>
      <input type="password" id="access-password" class="modal-input" />
      <div style="margin-top: 1em; display: flex; justify-content: center; gap: 1em;">
        <button id="access-submit">Submit</button>
      </div>
    </div>
  </div>

  <!-- Admin download -->
  <div id="admin-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <p style="margin-top: 0;">Enter admin password:</p>
      <input type="password" id="admin-password" class="modal-input" />
      <div style="margin-top: 1em; display: flex; justify-content: space-between; gap: 1em;">
        <button id="admin-submit">Download</button>
        <button id="admin-cancel" class="btn-gray">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Feedback modal -->
  <div id="checkin-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <p id="checkin-message" style="margin: 0;"></p>
      <div style="margin-top: 1em;">
        <button id="checkin-close">OK</button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
