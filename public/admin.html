v      </form>
    </section>

    <section class="admin-card">
      <h2>Email Notifications</h2>
      <form id="notifications-form" class="settings-form">
        <div class="settings-grid">
          <label class="settings-field">
            <span>Default recipients</span>
            <textarea id="default_recipients" class="admin-textarea" placeholder="email1@example.com, email2@example.com"></textarea>
          </label>

          <label class="settings-field">
            <span>Extra TT late recipients</span>
            <textarea id="tt_late_extra_recipients" class="admin-textarea" placeholder="extra@example.com"></textarea>
          </label>
        </div>

        <div class="toggle-grid">
          <label class="checkbox-field">
            <input id="send_late_emails" type="checkbox" />
            <span>Send late check-in emails</span>
          </label>

          <label class="checkbox-field">
            <input id="send_checkout_emails" type="checkbox" />
            <span>Send checkout emails</span>
          </label>

          <label class="checkbox-field">
            <input id="send_reminder_emails" type="checkbox" />
            <span>Send reminder emails</span>
          </label>
        </div>

        <div class="settings-actions">
          <button type="submit">Save Email Settings</button>
        </div>
      </form>
    </section>

    <section class="admin-card">
      <h2>Shift Schedule</h2>

      <div class="team-tabs">
        <button id="tab-DT" class="team-tab active" type="button" data-team="DT">DreamTeam</button>
        <button id="tab-TT" class="team-tab" type="button" data-team="TT">TechTeam</button>
      </div>

      <div class="admin-shift-toolbar">
        <label class="settings-field small">
          <span>Day</span>
          <select id="new-shift-weekday" class="admin-input">
            <option value="1">Monday</option>
            <option value="2">Tuesday</option>
            <option value="3">Wednesday</option>
            <option value="4">Thursday</option>
            <option value="5">Friday</option>
          </select>
        </label>

        <label class="settings-field small">
          <span>Shift name</span>
          <input id="new-shift-name" class="admin-input" placeholder="Morning / Afternoon / Event Shift" />
        </label>

        <label class="settings-field small">
          <span>Start time</span>
          <input id="new-shift-time" type="time" class="admin-input" />
        </label>

        <label class="checkbox-field">
          <input id="new-shift-active" type="checkbox" checked />
          <span>Enabled</span>
        </label>

        <div class="shift-toolbar-button-wrap">
          <button id="add-shift" type="button">Add Shift</button>
        </div>
      </div>

      <div id="shift-groups"></div>
    </section>

    <section class="admin-card">
      <h2>Add Person</h2>
      <div class="admin-add-row">
        <input id="new-name" class="admin-input" placeholder="Full name" />
        <button id="add-person" type="button">Add</button>
      </div>
    </section>

    <section class="admin-card">
      <h2>Current People</h2>
      <ul id="people-list" class="people-list"></ul>
    </section>

    <div id="admin-feedback" class="admin-feedback" style="display: none;"></div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
