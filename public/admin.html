<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="admin-page">
  <div class="admin-container">
    <div class="admin-header">
      <h1>Admin Panel</h1>
      <div class="admin-header-actions">
        <button id="download-log" type="button">Download Log</button>
        <button id="admin-logout" type="button" class="btn-gray">Log out</button>
      </div>
    </div>

    <section class="admin-card">
      <h2>Global Check-In Rules</h2>
      <form id="settings-form" class="settings-form">
        <div class="settings-grid">
          <label class="settings-field">
            <span>Early check-in window (minutes)</span>
            <input id="early_checkin_minutes" type="number" min="0" class="admin-input" />
          </label>

          <label class="settings-field">
            <span>Late grace period (minutes)</span>
            <input id="late_grace_minutes" type="number" min="0" class="admin-input" />
          </label>
        </div>

        <div class="settings-actions">
          <button type="submit">Save Global Rules</button>
        </div>
      </form>
    </section>

    <section class="admin-card">
      <h2>Shift Schedule</h2>

      <div class="team-tabs">
        <button id="tab-DT" class="team-tab active" type="button" data-team="DT">DreamTeam</button>
        <button id="tab-TT" class="team-tab" type="button" data-team="TT">TechTeam</button>
      </div>

      <div class="admin-shift-toolbar">
        <label class="settings-field small">
          <span>Day</span>
          <select id="new-shift-weekday" class="admin-input">
            <option value="1">Monday</option>
            <option value="2">Tuesday</option>
            <option value="3">Wednesday</option>
            <option value="4">Thursday</option>
            <option value="5">Friday</option>
            <option value="6">Saturday</option>
            <option value="7">Sunday</option>
          </select>
        </label>

        <label class="settings-field small">
          <span>Shift name</span>
          <input id="new-shift-name" class="admin-input" placeholder="Morning / Afternoon / Event Shift" />
        </label>

        <label class="settings-field small">
          <span>Start time</span>
          <input id="new-shift-time" type="time" class="admin-input" />
        </label>

        <label class="settings-field checkbox-field">
          <span>Enabled</span>
          <input id="new-shift-active" type="checkbox" checked />
        </label>

        <div class="shift-toolbar-button-wrap">
          <button id="add-shift" type="button">Add Shift</button>
        </div>
      </div>

      <div id="shift-groups"></div>
    </section>

    <section class="admin-card">
      <h2>Add Person</h2>
      <div class="admin-add-row">
        <input id="new-name" class="admin-input" placeholder="Full name" />
        <button id="add-person" type="button">Add</button>
      </div>
    </section>

    <section class="admin-card">
      <h2>Current People</h2>
      <ul id="people-list" class="people-list"></ul>
    </section>

    <div id="admin-feedback" class="admin-feedback" style="display: none;"></div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
